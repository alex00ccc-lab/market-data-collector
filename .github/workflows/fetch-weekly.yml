name: Weekly Fundamentals Fetch

on:
  schedule:
    # Saturday 08:00 BJT = 00:00 UTC
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  fetch-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      CI: true
      GITHUB_ACTIONS: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fundamentals
        run: |
          TODAY=$(date +%Y-%m-%d)
          echo "Fetching fundamentals for $TODAY"
          python -c "
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from source_manager import SourceManager

          mgr = SourceManager()
          today = '$TODAY'
          out_dir = Path('data') / today / 'fundamentals'
          out_dir.mkdir(parents=True, exist_ok=True)

          # Load US holdings + watchlist
          holdings_path = Path('config/holdings.json')
          watchlist_path = Path('config/watchlist.json')
          all_syms = []
          for cfg_path in (holdings_path, watchlist_path):
              if cfg_path.exists():
                  cfg = json.loads(cfg_path.read_text(encoding='utf-8'))
                  all_syms.extend([s for s in cfg.get('symbols', []) if s.get('market') == 'US'])

          for item in all_syms:
              sym = item['symbol']
              data = mgr.fetch_fundamentals(sym, 'US')
              if data:
                  (out_dir / f'{sym}.json').write_text(
                      json.dumps(data, ensure_ascii=False, indent=2),
                      encoding='utf-8',
                  )
                  print(f'  {sym}: PE={data.get(\"pe_ratio\")}, PB={data.get(\"pb_ratio\")}')
              else:
                  print(f'  {sym}: FAILED')
          " 2>&1

      - name: Commit and push
        run: |
          git config user.name "market-data-bot"
          git config user.email "bot@market-data-collector.local"
          git add -f data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: weekly fundamentals $TODAY"
            git push
          fi
