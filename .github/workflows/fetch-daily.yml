name: Fetch US / JP / A / HK Market Data

# ── Schedule (Beijing time) ──────────────────────────────────────────
# 08:05 BJT — US previous trading day close available (~05:00 BJT next day)
# 17:05 BJT — JP (14:00 BJT) closed; A (15:00) + HK (16:00) also closed → A/HK close fetched here
# Sat 08:05 BJT — US Friday close (needed for Saturday weekly review + Monday briefing)
on:
  schedule:
    - cron: '5 0 * * 1-5'
    - cron: '5 0 * * 6'
    - cron: '5 9 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force fetch (ignore trading calendar)'
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    strategy:
      fail-fast: false

    env:
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      CI: true
      GITHUB_ACTIONS: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate market labels
        run: python scripts/market_validate.py

      - name: Fetch market data
        id: fetch
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          # Retry up to 2 times on failure (network blips)
          for attempt in 1 2; do
            python scripts/fetch.py --lenient --markets US,JP,EU,A,HK $FORCE_FLAG 2>&1 | tee fetch.log
            EXIT_CODE=${PIPESTATUS[0]}
            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "exit_code=0" >> $GITHUB_OUTPUT
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
            else
              echo "Fetch attempt $attempt failed — retrying in 60s..."
              sleep 60
            fi
          done

      - name: Validate fetched data
        if: steps.fetch.outputs.exit_code == '0' || github.event_name == 'workflow_dispatch'
        run: |
          TODAY=$(date +%Y-%m-%d)
          DATA_DIR="data/$TODAY/quotes"
          BAD_FILES=0
          if [ -d "$DATA_DIR" ]; then
            for f in "$DATA_DIR"/*.json; do
              [ -f "$f" ] || continue
              # Check JSON is valid and has at least one bar with close > 0
              python -c "
          import json, sys
          try:
              data = json.loads(open('$f').read())
              if not isinstance(data, list) or len(data) == 0:
                  sys.exit(1)
              if data[0].get('close', 0) <= 0:
                  sys.exit(1)
          except: sys.exit(1)
          " 2>/dev/null || { echo "INVALID: $f"; BAD_FILES=$((BAD_FILES + 1)); }
            done
          fi
          if [ "$BAD_FILES" -gt 0 ]; then
            echo "WARNING: $BAD_FILES invalid data files found"
          fi
          echo "bad_files=$BAD_FILES" >> $GITHUB_OUTPUT

      - name: Compute indicators
        if: steps.fetch.outputs.exit_code == '0' || github.event_name == 'workflow_dispatch'
        run: |
          TODAY=$(date +%Y-%m-%d)
          python scripts/indicators.py --date "$TODAY"

      - name: Commit and push data
        if: always() && (steps.fetch.outputs.exit_code == '0' || github.event_name == 'workflow_dispatch')
        run: |
          git config user.name "market-data-bot"
          git config user.email "bot@market-data-collector.local"
          git add -f data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TODAY=$(date +%Y-%m-%d)
            git commit -m "data: auto fetch $TODAY"
            git push
          fi

      - name: Alert on fetch failure
        if: failure() && github.event_name == 'schedule'
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          # NOTE: market_data has its own repo — cannot import holdings-briefing's wechat_alert.py.
          # When wechat_alert.py is vendored into this repo, replace this inline call.
          python -c "
          import json, os, urllib.request
          webhook = os.getenv('WECOM_WEBHOOK_URL', '')
          if not webhook:
              print('WECOM_WEBHOOK_URL not set — alert skipped')
              exit(0)
          msg = f'⚠️ CI 数据抓取异常\\n\\n日期: $TODAY\\n仓库: market-data-collector\\n\\n请检查 Actions 日志: https://github.com/alex00ccc-lab/market-data-collector/actions'
          data = json.dumps({'msgtype': 'text', 'text': {'content': msg}}).encode()
          req = urllib.request.Request(webhook, data=data, headers={'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(req, timeout=10)
              print('WeChat alert sent')
          except Exception as e:
              print(f'WeChat alert failed: {e}')
          "
